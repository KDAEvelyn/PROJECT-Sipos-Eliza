<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Személyre szabott kozmetikai kezelések bőrfiatalításra és problémás bőrre az Eliza Beauty Salonban, Budapesten.">
  <meta name="theme-color" content="#FCF9F8">
  <title>[Koncepció neve] — Eliza Beauty Salon</title>
  <link rel="icon" type="image/svg+xml" href="eliza-alapanyag/logo-palettahoz-igazitva/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-primary': 'var(--color-brand-primary)',
            'brand-secondary': 'var(--color-brand-secondary)',
            'brand-accent': 'var(--color-brand-accent)',
            'brand-bg': 'var(--color-brand-bg)',
            'brand-surface': 'var(--color-brand-surface)',
            'brand-text': 'var(--color-brand-text)',
            'brand-muted': 'var(--color-brand-muted)',
          },
          fontFamily: {
            heading: 'var(--font-heading)',
            body: 'var(--font-body)',
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --color-brand-primary: #D59999;
      --color-brand-secondary: #3C0B1D;
      --color-brand-accent: #828282;
      --color-brand-bg: #FCF9F8;
      --color-brand-surface: #F7EBEB;
      --color-brand-text: #62636A;
      --color-brand-muted: #828282;
      --font-heading: 'Quicksand', Montserrat, sans-serif;
      --font-body: 'Montserrat', Arial, sans-serif;
    }
    body { background: var(--color-brand-bg); color: var(--color-brand-text); font-family: var(--font-body); }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); }
  </style>
</head>
